plugin: amazon.aws.aws_ec2
regions:
- us-east-1
filters:
  tag:Name: nginx
  instance-state-name : running
hostnames:
  - private-ip-address
compose:
  ansible_host: private_ip_address  #With it, you control exactly where it connects. 

  # what this line do
  # compose:
  # ansible_host: private_ip_address
  #----->It creates the variable ansible_host for each EC2 instance in your inventory.
  #----->It assigns the value of the instance’s private_ip_address to ansible_host.
